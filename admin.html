<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin — MKT Portal</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#0f0f0f;color:#f1f5f9;min-height:100vh}
header{background:#1a1a1a;border-bottom:1px solid #2d2d2d;padding:16px 20px;display:flex;align-items:center;gap:12px}
header h1{font-size:18px;font-weight:700;color:#f9fafb}
header span{font-size:12px;color:#9ca3af;margin-left:auto}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:8px;border:none;cursor:pointer;font-size:13px;font-weight:600;transition:all .15s}
.btn-red{background:#ef4444;color:#fff}.btn-red:hover{background:#dc2626}
.btn-gold{background:#b8860b;color:#fff}.btn-gold:hover{background:#9a6f00}
.btn-gray{background:#374151;color:#f1f5f9}.btn-gray:hover{background:#4b5563}
.container{max-width:1100px;margin:0 auto;padding:20px}
.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.toolbar input{flex:1;min-width:200px;padding:8px 12px;background:#1a1a1a;border:1px solid #374151;border-radius:8px;color:#f1f5f9;font-size:13px}
.toolbar input:focus{outline:none;border-color:#b8860b}
.stats{display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.stat{background:#1a1a1a;border:1px solid #2d2d2d;border-radius:10px;padding:12px 16px;min-width:100px}
.stat .label{font-size:10px;color:#9ca3af;text-transform:uppercase;letter-spacing:.05em}
.stat .value{font-size:22px;font-weight:800;color:#f9fafb;margin-top:2px}
table{width:100%;border-collapse:collapse;background:#1a1a1a;border:1px solid #2d2d2d;border-radius:12px;overflow:hidden}
th{background:#111;padding:10px 12px;font-size:11px;color:#9ca3af;text-transform:uppercase;letter-spacing:.05em;text-align:left}
td{padding:10px 12px;font-size:13px;border-top:1px solid #2d2d2d;vertical-align:middle}
tr:hover td{background:#1f1f1f}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:700;background:#374151;color:#9ca3af}
.img-thumb{width:48px;height:48px;object-fit:cover;border-radius:6px;background:#111}
.title-cell{max-width:300px}
.title-cell a{color:#f9fafb;text-decoration:none;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.title-cell a:hover{color:#b8860b}
.actions{display:flex;gap:6px;white-space:nowrap}
.modal-bg{display:none;position:fixed;inset:0;background:#000a;z-index:100;align-items:center;justify-content:center}
.modal-bg.open{display:flex}
.modal{background:#1a1a1a;border:1px solid #374151;border-radius:16px;padding:24px;max-width:520px;width:90%;max-height:80vh;overflow-y:auto}
.modal h2{font-size:16px;font-weight:700;margin-bottom:16px}
.field{margin-bottom:12px}
.field label{display:block;font-size:11px;color:#9ca3af;margin-bottom:4px;text-transform:uppercase}
.field input,.field textarea,.field select{width:100%;padding:8px 12px;background:#111;border:1px solid #374151;border-radius:8px;color:#f1f5f9;font-size:13px}
.field textarea{height:80px;resize:vertical}
.field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:#b8860b}
.modal-actions{display:flex;gap:8px;margin-top:16px;justify-content:flex-end}
.toast{position:fixed;bottom:24px;right:24px;background:#22c55e;color:#fff;padding:12px 20px;border-radius:10px;font-size:13px;font-weight:600;z-index:200;transform:translateY(80px);opacity:0;transition:all .3s}
.toast.show{transform:translateY(0);opacity:1}
.toast.err{background:#ef4444}
.empty{text-align:center;padding:48px;color:#9ca3af}
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh}
.login-box{background:#1a1a1a;border:1px solid #2d2d2d;border-radius:16px;padding:32px;width:320px;text-align:center}
.login-box h2{margin-bottom:4px;font-size:20px}
.login-box p{font-size:13px;color:#9ca3af;margin-bottom:20px}
.login-box input{width:100%;padding:10px 14px;background:#111;border:1px solid #374151;border-radius:8px;color:#f1f5f9;font-size:14px;margin-bottom:10px}
.login-box input:focus{outline:none;border-color:#b8860b}
#loginErr{color:#ef4444;font-size:12px;margin-bottom:8px;min-height:16px}
#app{display:none}
</style>
</head>
<body>

<!-- Login -->
<div class="login-wrap" id="loginWrap">
  <div class="login-box">
    <div style="font-size:36px;margin-bottom:8px">🛡️</div>
    <h2>MKT Portal Admin</h2>
    <p>Acesso restrito</p>
    <input type="password" id="pwdInput" placeholder="Senha de acesso" onkeydown="if(event.key==='Enter')doLogin()">
    <div id="loginErr"></div>
    <button class="btn btn-gold" style="width:100%;justify-content:center" onclick="doLogin()">Entrar</button>
  </div>
</div>

<!-- App -->
<div id="app">
<header>
  <span style="font-size:22px">🗞️</span>
  <h1>MKT Portal — Admin</h1>
  <span id="headerStats"></span>
  <button class="btn btn-gray" onclick="logout()" style="margin-left:12px">Sair</button>
</header>

<div class="container">
  <div class="stats">
    <div class="stat"><div class="label">Total</div><div class="value" id="stTotal">—</div></div>
    <div class="stat"><div class="label">Hoje</div><div class="value" id="stHoje">—</div></div>
    <div class="stat"><div class="label">Categorias</div><div class="value" id="stCat">—</div></div>
  </div>

  <div class="toolbar">
    <input id="search" placeholder="🔍 Buscar por título..." oninput="filterTable()">
    <select id="filterCat" onchange="filterTable()" style="padding:8px 12px;background:#1a1a1a;border:1px solid #374151;border-radius:8px;color:#f1f5f9;font-size:13px">
      <option value="">Todas as categorias</option>
    </select>
    <button class="btn btn-gold" onclick="openNew()">+ Nova matéria</button>
    <button class="btn btn-gray" onclick="loadArticles()">↺ Atualizar</button>
  </div>

  <table>
    <thead>
      <tr>
        <th style="width:56px">Img</th>
        <th>Título</th>
        <th>Categoria</th>
        <th>Cidade</th>
        <th>Data</th>
        <th>Ações</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
  <div id="emptyMsg" class="empty" style="display:none">Nenhuma matéria encontrada.</div>
  <div style="text-align:center;margin-top:12px;color:#9ca3af;font-size:12px" id="pagination"></div>
</div>
</div>

<!-- Modal editar/criar -->
<div class="modal-bg" id="modal">
  <div class="modal">
    <h2 id="modalTitle">Editar matéria</h2>
    <input type="hidden" id="editId">
    <div class="field"><label>Título</label><input id="eTitle"></div>
    <div class="field"><label>Resumo / Lide</label><textarea id="eSummary"></textarea></div>
    <div class="field"><label>Conteúdo completo</label><textarea id="eContent" style="height:120px"></textarea></div>
    <div class="field"><label>URL da imagem</label><input id="eImage"></div>
    <div class="field"><label>Categoria</label>
      <select id="eCategory">
        <option>Notícia</option><option>Política</option><option>Saúde</option>
        <option>Segurança</option><option>Obras</option><option>Entretenimento</option>
        <option>Economia</option><option>Educação</option>
      </select>
    </div>
    <div class="field"><label>Cidade</label><input id="eCity"></div>
    <div class="field"><label>Seção</label><input id="eSection"></div>
    <div class="modal-actions">
      <button class="btn btn-gray" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-gold" onclick="saveArticle()">Salvar</button>
    </div>
  </div>
</div>

<!-- Confirmar delete -->
<div class="modal-bg" id="delModal">
  <div class="modal" style="text-align:center">
    <div style="font-size:40px;margin-bottom:12px">🗑️</div>
    <h2>Excluir matéria?</h2>
    <p style="color:#9ca3af;margin:10px 0 20px;font-size:14px">Esta ação não pode ser desfeita.</p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn btn-gray" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-red" onclick="confirmDelete()">Excluir</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SB_URL="https://yuqidbvfilomxkwaaerl.supabase.co";
const SB_KEY="sb_publishable_t3Qiwi-26sBX-0mbtdjXCA__h26yp3p";
const ADMIN_PWD="m20admin2026";

let allArticles=[];
let deleteId=null;

function doLogin(){
  const v=document.getElementById("pwdInput").value;
  if(v===ADMIN_PWD){
    sessionStorage.setItem("m20admin","1");
    document.getElementById("loginWrap").style.display="none";
    document.getElementById("app").style.display="block";
    loadArticles();
  } else {
    document.getElementById("loginErr").textContent="Senha incorreta.";
  }
}

function logout(){
  sessionStorage.removeItem("m20admin");
  location.reload();
}

window.onload=function(){
  if(sessionStorage.getItem("m20admin")==="1"){
    document.getElementById("loginWrap").style.display="none";
    document.getElementById("app").style.display="block";
    loadArticles();
  }
};

async function loadArticles(){
  try{
    const r=await fetch(SB_URL+"/rest/v1/articles?select=id,title,summary,content,image_url,category,city,section,published_at&order=published_at.desc&limit=200",
      {headers:{apikey:SB_KEY,Authorization:"Bearer "+SB_KEY}});
    allArticles=await r.json();
    renderStats();
    renderTable(allArticles);
    populateCatFilter();
  }catch(e){showToast("Erro ao carregar: "+e.message,true);}
}

function renderStats(){
  document.getElementById("stTotal").textContent=allArticles.length;
  const today=new Date().toISOString().slice(0,10);
  const hoje=allArticles.filter(a=>a.published_at&&a.published_at.startsWith(today)).length;
  document.getElementById("stHoje").textContent=hoje;
  const cats=new Set(allArticles.map(a=>a.category).filter(Boolean));
  document.getElementById("stCat").textContent=cats.size;
}

function populateCatFilter(){
  const sel=document.getElementById("filterCat");
  const cats=[...new Set(allArticles.map(a=>a.category).filter(Boolean))].sort();
  sel.innerHTML='<option value="">Todas as categorias</option>';
  cats.forEach(c=>{const o=document.createElement("option");o.value=c;o.textContent=c;sel.appendChild(o);});
}

function filterTable(){
  const q=document.getElementById("search").value.toLowerCase();
  const cat=document.getElementById("filterCat").value;
  const filtered=allArticles.filter(a=>{
    const matchQ=!q||a.title?.toLowerCase().includes(q)||a.city?.toLowerCase().includes(q);
    const matchCat=!cat||a.category===cat;
    return matchQ&&matchCat;
  });
  renderTable(filtered);
}

function renderTable(articles){
  const tbody=document.getElementById("tbody");
  const empty=document.getElementById("emptyMsg");
  if(!articles.length){tbody.innerHTML="";empty.style.display="block";return;}
  empty.style.display="none";
  tbody.innerHTML=articles.map(a=>`
    <tr>
      <td>${a.image_url?`<img class="img-thumb" src="${a.image_url}" onerror="this.style.display='none'">`:`<div class="img-thumb" style="background:#2d2d2d;display:flex;align-items:center;justify-content:center;font-size:20px">📰</div>`}</td>
      <td class="title-cell"><a href="${SB_URL.replace('.supabase.co','')}#" title="${a.title||''}">${a.title||'—'}</a><div style="font-size:11px;color:#9ca3af;margin-top:2px">${(a.summary||'').slice(0,80)}…</div></td>
      <td><span class="badge">${a.category||'—'}</span></td>
      <td style="font-size:12px;color:#9ca3af">${a.city||'—'}</td>
      <td style="font-size:11px;color:#9ca3af;white-space:nowrap">${a.published_at?new Date(a.published_at).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'—'}</td>
      <td class="actions">
        <button class="btn btn-gray" style="padding:5px 10px;font-size:11px" onclick="editArticle('${a.id}')">✏️ Editar</button>
        <button class="btn btn-red" style="padding:5px 10px;font-size:11px" onclick="askDelete('${a.id}')">🗑️</button>
      </td>
    </tr>
  `).join("");
}

function openNew(){
  document.getElementById("modalTitle").textContent="Nova matéria";
  document.getElementById("editId").value="";
  ["eTitle","eSummary","eContent","eImage","eCity","eSection"].forEach(id=>document.getElementById(id).value="");
  document.getElementById("eCategory").value="Notícia";
  document.getElementById("modal").classList.add("open");
}

function editArticle(id){
  const a=allArticles.find(x=>x.id==id);
  if(!a)return;
  document.getElementById("modalTitle").textContent="Editar matéria";
  document.getElementById("editId").value=id;
  document.getElementById("eTitle").value=a.title||"";
  document.getElementById("eSummary").value=a.summary||"";
  document.getElementById("eContent").value=a.content||"";
  document.getElementById("eImage").value=a.image_url||"";
  document.getElementById("eCategory").value=a.category||"Notícia";
  document.getElementById("eCity").value=a.city||"";
  document.getElementById("eSection").value=a.section||"";
  document.getElementById("modal").classList.add("open");
}

async function saveArticle(){
  const id=document.getElementById("editId").value;
  const payload={
    title:document.getElementById("eTitle").value,
    summary:document.getElementById("eSummary").value,
    content:document.getElementById("eContent").value,
    image_url:document.getElementById("eImage").value,
    category:document.getElementById("eCategory").value,
    city:document.getElementById("eCity").value,
    section:document.getElementById("eSection").value,
  };
  try{
    const url=SB_URL+"/rest/v1/articles"+(id?"?id=eq."+id:"");
    const method=id?"PATCH":"POST";
    const headers={apikey:SB_KEY,Authorization:"Bearer "+SB_KEY,"Content-Type":"application/json",Prefer:"return=minimal"};
    if(!id)payload.published_at=new Date().toISOString();
    const r=await fetch(url,{method,headers,body:JSON.stringify(payload)});
    if(r.ok||r.status===204||r.status===201){
      showToast(id?"Matéria atualizada!":"Matéria criada!");
      closeModal();loadArticles();
    }else{showToast("Erro ao salvar",true);}
  }catch(e){showToast("Erro: "+e.message,true);}
}

function askDelete(id){
  deleteId=id;
  document.getElementById("delModal").classList.add("open");
}

async function confirmDelete(){
  if(!deleteId)return;
  try{
    const r=await fetch(SB_URL+"/rest/v1/articles?id=eq."+deleteId,
      {method:"DELETE",headers:{apikey:SB_KEY,Authorization:"Bearer "+SB_KEY}});
    if(r.ok||r.status===204){showToast("Matéria excluída!");closeModal();loadArticles();}
    else showToast("Erro ao excluir",true);
  }catch(e){showToast("Erro: "+e.message,true);}
  deleteId=null;
}

function closeModal(){
  document.getElementById("modal").classList.remove("open");
  document.getElementById("delModal").classList.remove("open");
}

function showToast(msg,err=false){
  const t=document.getElementById("toast");
  t.textContent=msg;
  t.className="toast"+(err?" err":"");
  t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"),3000);
}
</script>
</body>
</html>
