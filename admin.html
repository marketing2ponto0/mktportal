<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin — MKT Portal</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#0f0f0f;color:#f1f5f9;min-height:100vh}
header{background:#1a1a1a;border-bottom:1px solid #2d2d2d;padding:14px 20px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:50}
header h1{font-size:17px;font-weight:700;color:#f9fafb}
.tabs-nav{display:flex;gap:4px;margin-left:auto}
.tab-btn{padding:6px 14px;border-radius:6px;border:none;cursor:pointer;font-size:12px;font-weight:600;background:#2d2d2d;color:#9ca3af;transition:all .15s}
.tab-btn.active{background:#b8860b;color:#fff}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:8px;border:none;cursor:pointer;font-size:12px;font-weight:600;transition:all .15s}
.btn-red{background:#ef4444;color:#fff}.btn-red:hover{background:#dc2626}
.btn-gold{background:#b8860b;color:#fff}.btn-gold:hover{background:#9a6f00}
.btn-gray{background:#374151;color:#f1f5f9}.btn-gray:hover{background:#4b5563}
.btn-green{background:#16a34a;color:#fff}.btn-green:hover{background:#15803d}
.container{max-width:1100px;margin:0 auto;padding:16px}
.toolbar{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.toolbar input,.toolbar select{padding:8px 12px;background:#1a1a1a;border:1px solid #374151;border-radius:8px;color:#f1f5f9;font-size:13px}
.toolbar input{flex:1;min-width:180px}
.toolbar input:focus,.toolbar select:focus{outline:none;border-color:#b8860b}
.stats{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.stat{background:#1a1a1a;border:1px solid #2d2d2d;border-radius:10px;padding:10px 14px;min-width:90px}
.stat .label{font-size:10px;color:#9ca3af;text-transform:uppercase;letter-spacing:.05em}
.stat .value{font-size:20px;font-weight:800;color:#f9fafb;margin-top:2px}
table{width:100%;border-collapse:collapse;background:#1a1a1a;border:1px solid #2d2d2d;border-radius:12px;overflow:hidden}
th{background:#111;padding:9px 10px;font-size:11px;color:#9ca3af;text-transform:uppercase;letter-spacing:.05em;text-align:left}
td{padding:9px 10px;font-size:12px;border-top:1px solid #2d2d2d;vertical-align:middle}
tr:hover td{background:#1f1f1f}
.badge{display:inline-block;padding:2px 7px;border-radius:20px;font-size:10px;font-weight:700;background:#374151;color:#9ca3af}
.img-thumb{width:44px;height:44px;object-fit:cover;border-radius:6px;background:#111}
.title-cell{max-width:260px}
.title-cell strong{color:#f9fafb;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:12px}
.title-cell small{color:#6b7280;font-size:10px;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.actions{display:flex;gap:5px;white-space:nowrap}
/* modal */
.modal-bg{display:none;position:fixed;inset:0;background:#000b;z-index:100;align-items:center;justify-content:center;padding:16px}
.modal-bg.open{display:flex}
.modal{background:#1a1a1a;border:1px solid #374151;border-radius:16px;padding:20px;max-width:540px;width:100%;max-height:88vh;overflow-y:auto}
.modal h2{font-size:15px;font-weight:700;margin-bottom:14px}
.field{margin-bottom:11px}
.field label{display:block;font-size:10px;color:#9ca3af;margin-bottom:3px;text-transform:uppercase;letter-spacing:.04em}
.field input,.field textarea,.field select{width:100%;padding:8px 10px;background:#111;border:1px solid #374151;border-radius:8px;color:#f1f5f9;font-size:13px}
.field textarea{height:70px;resize:vertical}
.field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:#b8860b}
.modal-actions{display:flex;gap:8px;margin-top:14px;justify-content:flex-end}
/* banner cards */
.banner-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.banner-card{background:#1a1a1a;border:1px solid #2d2d2d;border-radius:12px;overflow:hidden}
.banner-card img{width:100%;height:120px;object-fit:cover;display:block;background:#111}
.banner-card .bc-body{padding:10px}
.banner-card .bc-title{font-size:13px;font-weight:700;color:#f9fafb;margin-bottom:4px}
.banner-card .bc-meta{font-size:11px;color:#9ca3af;margin-bottom:8px}
.banner-card .bc-actions{display:flex;gap:6px}
.pill-on{background:#16a34a30;color:#4ade80;padding:2px 7px;border-radius:20px;font-size:10px;font-weight:700}
.pill-off{background:#ef444430;color:#f87171;padding:2px 7px;border-radius:20px;font-size:10px;font-weight:700}
/* toast */
.toast{position:fixed;bottom:20px;right:16px;background:#22c55e;color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;font-weight:600;z-index:200;transform:translateY(80px);opacity:0;transition:all .3s;max-width:280px}
.toast.show{transform:translateY(0);opacity:1}
.toast.err{background:#ef4444}
/* login */
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh}
.login-box{background:#1a1a1a;border:1px solid #2d2d2d;border-radius:16px;padding:28px;width:300px;text-align:center}
.login-box h2{margin-bottom:4px;font-size:19px}
.login-box p{font-size:12px;color:#9ca3af;margin-bottom:16px}
.login-box input{width:100%;padding:10px 12px;background:#111;border:1px solid #374151;border-radius:8px;color:#f1f5f9;font-size:14px;margin-bottom:8px}
.login-box input:focus{outline:none;border-color:#b8860b}
#loginErr{color:#ef4444;font-size:11px;margin-bottom:8px;min-height:14px}
#app{display:none}
.section{display:none}.section.active{display:block}
</style>
</head>
<body>

<div class="login-wrap" id="loginWrap">
  <div class="login-box">
    <div style="font-size:34px;margin-bottom:8px">🛡️</div>
    <h2>MKT Portal Admin</h2>
    <p>Acesso restrito</p>
    <input type="password" id="pwdInput" placeholder="Senha" onkeydown="if(event.key==='Enter')doLogin()">
    <div id="loginErr"></div>
    <button class="btn btn-gold" style="width:100%;justify-content:center" onclick="doLogin()">Entrar</button>
  </div>
</div>

<div id="app">
<header>
  <span style="font-size:20px">🗞️</span>
  <h1>MKT Portal — Admin</h1>
  <div class="tabs-nav">
    <button class="tab-btn active" onclick="showSection('materia')">📰 Matérias</button>
    <button class="tab-btn" onclick="showSection('banner')">🖼️ Banners</button>
  </div>
  <button class="btn btn-gray" onclick="logout()" style="margin-left:8px;padding:5px 10px;font-size:11px">Sair</button>
</header>

<div class="container">

  <!-- MATÉRIAS -->
  <div class="section active" id="sec-materia">
    <div class="stats">
      <div class="stat"><div class="label">Total</div><div class="value" id="stTotal">—</div></div>
      <div class="stat"><div class="label">Hoje</div><div class="value" id="stHoje">—</div></div>
      <div class="stat"><div class="label">Categorias</div><div class="value" id="stCat">—</div></div>
    </div>
    <div class="toolbar">
      <input id="search" placeholder="🔍 Buscar por título..." oninput="filterTable()">
      <select id="filterCat" onchange="filterTable()">
        <option value="">Todas as categorias</option>
      </select>
      <button class="btn btn-gold" onclick="openNew()">+ Nova matéria</button>
      <button class="btn btn-gray" onclick="loadArticles()">↺</button>
    </div>
    <table>
      <thead><tr>
        <th style="width:52px">Img</th>
        <th>Título</th>
        <th>Categoria</th>
        <th>Cidade</th>
        <th>Data</th>
        <th>Ações</th>
      </tr></thead>
      <tbody id="tbody"></tbody>
    </table>
    <div id="emptyMsg" style="text-align:center;padding:40px;color:#9ca3af;display:none">Nenhuma matéria.</div>
  </div>

  <!-- BANNERS -->
  <div class="section" id="sec-banner">
    <div class="toolbar">
      <span style="font-size:13px;color:#9ca3af">Gerencie os banners exibidos no portal</span>
      <button class="btn btn-gold" onclick="openNewBanner()" style="margin-left:auto">+ Novo banner</button>
      <button class="btn btn-gray" onclick="loadBanners()">↺</button>
    </div>
    <div class="banner-grid" id="bannerGrid"></div>
    <div id="bannerEmpty" style="text-align:center;padding:40px;color:#9ca3af;display:none">Nenhum banner cadastrado.</div>
  </div>

</div><!-- /container -->
</div><!-- /app -->

<!-- Modal matéria -->
<div class="modal-bg" id="modal">
  <div class="modal">
    <h2 id="modalTitle">Editar matéria</h2>
    <input type="hidden" id="editId">
    <div class="field"><label>Título</label><input id="eTitle"></div>
    <div class="field"><label>Resumo / Lide</label><textarea id="eSummary"></textarea></div>
    <div class="field"><label>Conteúdo completo</label><textarea id="eContent" style="height:110px"></textarea></div>
    <div class="field"><label>URL da imagem</label><input id="eImage" placeholder="https://..."></div>
    <div class="field"><label>Categoria</label>
      <select id="eCategory">
        <option>Notícia</option><option>Política</option><option>Saúde</option>
        <option>Segurança</option><option>Obras</option><option>Entretenimento</option>
        <option>Economia</option><option>Educação</option>
      </select>
    </div>
    <div class="field"><label>Cidade</label><input id="eCity"></div>
    <div class="field"><label>Seção</label><input id="eSection"></div>
    <div class="modal-actions">
      <button class="btn btn-gray" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-gold" onclick="saveArticle()">Salvar</button>
    </div>
  </div>
</div>

<!-- Modal banner -->
<div class="modal-bg" id="bannerModal">
  <div class="modal">
    <h2 id="bannerModalTitle">Novo banner</h2>
    <input type="hidden" id="bEditId">
    <div class="field"><label>Título (opcional)</label><input id="bTitle" placeholder="Ex: Promoção Natal"></div>
    <div class="field"><label>URL da imagem *</label><input id="bImage" placeholder="https://..."></div>
    <div class="field"><label>Link ao clicar (opcional)</label><input id="bLink" placeholder="https://..."></div>
    <div class="field"><label>Posição</label>
      <select id="bPosition">
        <option value="top">Topo</option>
        <option value="middle">Meio</option>
        <option value="bottom">Rodapé</option>
      </select>
    </div>
    <div class="field"><label>Ordem (número)</label><input id="bOrder" type="number" value="0"></div>
    <div class="field"><label>Status</label>
      <select id="bActive">
        <option value="true">Ativo</option>
        <option value="false">Inativo</option>
      </select>
    </div>
    <div class="modal-actions">
      <button class="btn btn-gray" onclick="closeBannerModal()">Cancelar</button>
      <button class="btn btn-gold" onclick="saveBanner()">Salvar</button>
    </div>
  </div>
</div>

<!-- Confirmar delete -->
<div class="modal-bg" id="delModal">
  <div class="modal" style="text-align:center;max-width:380px">
    <div style="font-size:36px;margin-bottom:10px">🗑️</div>
    <h2>Excluir?</h2>
    <p style="color:#9ca3af;margin:8px 0 18px;font-size:13px">Esta ação não pode ser desfeita.</p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn btn-gray" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-red" onclick="confirmDelete()">Excluir</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SB_URL="https://yuqidbvfilomxkwaaerl.supabase.co";
const SB_KEY="sb_publishable_t3Qiwi-26sBX-0mbtdjXCA__h26yp3p";
const ADMIN_PWD="m20admin2026";
const H={apikey:SB_KEY,Authorization:"Bearer "+SB_KEY,"Content-Type":"application/json"};

let allArticles=[];
let deleteId=null;
let deleteTable=null;

function doLogin(){
  const v=document.getElementById("pwdInput").value;
  if(v===ADMIN_PWD){
    sessionStorage.setItem("m20admin","1");
    document.getElementById("loginWrap").style.display="none";
    document.getElementById("app").style.display="block";
    loadArticles();
  } else {
    document.getElementById("loginErr").textContent="Senha incorreta.";
  }
}
function logout(){sessionStorage.removeItem("m20admin");location.reload();}

window.onload=function(){
  if(sessionStorage.getItem("m20admin")==="1"){
    document.getElementById("loginWrap").style.display="none";
    document.getElementById("app").style.display="block";
    loadArticles();
  }
};

function showSection(name){
  document.querySelectorAll(".section").forEach(s=>s.classList.remove("active"));
  document.querySelectorAll(".tab-btn").forEach(b=>b.classList.remove("active"));
  document.getElementById("sec-"+name).classList.add("active");
  event.currentTarget.classList.add("active");
  if(name==="banner") loadBanners();
}

/* ── MATÉRIAS ── */
async function loadArticles(){
  try{
    const r=await fetch(SB_URL+"/rest/v1/articles?select=id,title,summary,content,image_url,category,city,section,published_at,source_url&order=published_at.desc&limit=200",{headers:H});
    allArticles=await r.json();
    if(!Array.isArray(allArticles)){allArticles=[];showToast("Erro ao carregar matérias",true);return;}
    renderStats();renderTable(allArticles);populateCatFilter();
  }catch(e){showToast("Erro: "+e.message,true);}
}

function renderStats(){
  document.getElementById("stTotal").textContent=allArticles.length;
  const today=new Date().toISOString().slice(0,10);
  document.getElementById("stHoje").textContent=allArticles.filter(a=>a.published_at&&a.published_at.startsWith(today)).length;
  document.getElementById("stCat").textContent=new Set(allArticles.map(a=>a.category).filter(Boolean)).size;
}

function populateCatFilter(){
  const sel=document.getElementById("filterCat");
  const cats=[...new Set(allArticles.map(a=>a.category).filter(Boolean))].sort();
  sel.innerHTML='<option value="">Todas as categorias</option>';
  cats.forEach(c=>{const o=document.createElement("option");o.value=c;o.textContent=c;sel.appendChild(o);});
}

function filterTable(){
  const q=document.getElementById("search").value.toLowerCase();
  const cat=document.getElementById("filterCat").value;
  renderTable(allArticles.filter(a=>(!q||a.title?.toLowerCase().includes(q)||a.city?.toLowerCase().includes(q))&&(!cat||a.category===cat)));
}

function renderTable(articles){
  const tbody=document.getElementById("tbody");
  document.getElementById("emptyMsg").style.display=articles.length?"none":"block";
  if(!articles.length){tbody.innerHTML="";return;}
  tbody.innerHTML=articles.map(a=>`
    <tr>
      <td>${a.image_url?`<img class="img-thumb" src="${a.image_url}" onerror="this.style.display='none'">`:`<div class="img-thumb" style="background:#2d2d2d;display:flex;align-items:center;justify-content:center;font-size:18px">📰</div>`}</td>
      <td class="title-cell"><strong>${a.title||'—'}</strong><small>${(a.summary||'').slice(0,70)}</small></td>
      <td><span class="badge">${a.category||'—'}</span></td>
      <td style="color:#9ca3af;white-space:nowrap">${a.city||'—'}</td>
      <td style="color:#6b7280;white-space:nowrap;font-size:11px">${a.published_at?new Date(a.published_at).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'—'}</td>
      <td class="actions">
        <button class="btn btn-gray" style="padding:4px 9px" onclick="editArticle('${a.id}')">✏️</button>
        <button class="btn btn-red" style="padding:4px 9px" onclick="askDelete('${a.id}','articles')">🗑️</button>
      </td>
    </tr>
  `).join("");
}

function openNew(){
  document.getElementById("modalTitle").textContent="Nova matéria";
  document.getElementById("editId").value="";
  ["eTitle","eSummary","eContent","eImage","eCity","eSection"].forEach(id=>document.getElementById(id).value="");
  document.getElementById("eCategory").value="Notícia";
  document.getElementById("modal").classList.add("open");
}

function editArticle(id){
  const a=allArticles.find(x=>x.id==id);
  if(!a)return;
  document.getElementById("modalTitle").textContent="Editar matéria";
  document.getElementById("editId").value=a.id;
  document.getElementById("eTitle").value=a.title||"";
  document.getElementById("eSummary").value=a.summary||"";
  document.getElementById("eContent").value=a.content||"";
  document.getElementById("eImage").value=a.image_url||"";
  document.getElementById("eCategory").value=a.category||"Notícia";
  document.getElementById("eCity").value=a.city||"";
  document.getElementById("eSection").value=a.section||"";
  document.getElementById("modal").classList.add("open");
}

async function saveArticle(){
  const id=document.getElementById("editId").value.trim();
  const payload={
    title:document.getElementById("eTitle").value,
    summary:document.getElementById("eSummary").value,
    content:document.getElementById("eContent").value,
    image_url:document.getElementById("eImage").value,
    category:document.getElementById("eCategory").value,
    city:document.getElementById("eCity").value,
    section:document.getElementById("eSection").value,
  };
  try{
    let url,method;
    if(id){
      url=SB_URL+"/rest/v1/articles?id=eq."+encodeURIComponent(id);
      method="PATCH";
    } else {
      url=SB_URL+"/rest/v1/articles";
      method="POST";
      payload.published_at=new Date().toISOString();
    }
    const r=await fetch(url,{method,headers:{...H,Prefer:"return=minimal"},body:JSON.stringify(payload)});
    if(r.ok||r.status===204||r.status===201){
      showToast(id?"✅ Atualizada!":"✅ Criada!");closeModal();loadArticles();
    } else {
      const err=await r.text();
      showToast("Erro "+r.status+": "+err.slice(0,80),true);
    }
  }catch(e){showToast("Erro: "+e.message,true);}
}

/* ── BANNERS ── */
let allBanners=[];

async function loadBanners(){
  try{
    const r=await fetch(SB_URL+"/rest/v1/banners?select=*&order=sort_order.asc",{headers:H});
    allBanners=await r.json();
    if(!Array.isArray(allBanners)){allBanners=[];}
    renderBanners();
  }catch(e){showToast("Erro banners: "+e.message,true);}
}

function renderBanners(){
  const grid=document.getElementById("bannerGrid");
  document.getElementById("bannerEmpty").style.display=allBanners.length?"none":"block";
  grid.innerHTML=allBanners.map(b=>`
    <div class="banner-card">
      <img src="${b.image_url}" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22100%22 height=%22120%22><rect fill=%22%232d2d2d%22 width=%22100%25%22 height=%22100%25%22/><text x=%2250%25%22 y=%2250%25%22 fill=%22%236b7280%22 text-anchor=%22middle%22 dominant-baseline=%22middle%22 font-size=%2228%22>🖼️</text></svg>'">
      <div class="bc-body">
        <div class="bc-title">${b.title||"Banner"}</div>
        <div class="bc-meta">
          <span>${b.position==="top"?"Topo":b.position==="middle"?"Meio":"Rodapé"}</span> ·
          <span class="${b.active?"pill-on":"pill-off"}">${b.active?"Ativo":"Inativo"}</span>
          ${b.link_url?` · <a href="${b.link_url}" target="_blank" style="color:#93c5fd;font-size:10px">link ↗</a>`:""}
        </div>
        <div class="bc-actions">
          <button class="btn btn-gray" style="padding:4px 10px;font-size:11px" onclick="editBanner('${b.id}')">✏️ Editar</button>
          <button class="btn btn-${b.active?"gray":"green"}" style="padding:4px 10px;font-size:11px" onclick="toggleBanner('${b.id}',${!b.active})">${b.active?"Desativar":"Ativar"}</button>
          <button class="btn btn-red" style="padding:4px 9px" onclick="askDelete('${b.id}','banners')">🗑️</button>
        </div>
      </div>
    </div>
  `).join("");
}

function openNewBanner(){
  document.getElementById("bannerModalTitle").textContent="Novo banner";
  document.getElementById("bEditId").value="";
  ["bTitle","bImage","bLink"].forEach(id=>document.getElementById(id).value="");
  document.getElementById("bPosition").value="top";
  document.getElementById("bOrder").value="0";
  document.getElementById("bActive").value="true";
  document.getElementById("bannerModal").classList.add("open");
}

function editBanner(id){
  const b=allBanners.find(x=>x.id==id);
  if(!b)return;
  document.getElementById("bannerModalTitle").textContent="Editar banner";
  document.getElementById("bEditId").value=b.id;
  document.getElementById("bTitle").value=b.title||"";
  document.getElementById("bImage").value=b.image_url||"";
  document.getElementById("bLink").value=b.link_url||"";
  document.getElementById("bPosition").value=b.position||"top";
  document.getElementById("bOrder").value=b.sort_order||0;
  document.getElementById("bActive").value=String(b.active!==false);
  document.getElementById("bannerModal").classList.add("open");
}

async function saveBanner(){
  const id=document.getElementById("bEditId").value.trim();
  const img=document.getElementById("bImage").value.trim();
  if(!img){showToast("URL da imagem é obrigatória",true);return;}
  const payload={
    title:document.getElementById("bTitle").value,
    image_url:img,
    link_url:document.getElementById("bLink").value||null,
    position:document.getElementById("bPosition").value,
    sort_order:parseInt(document.getElementById("bOrder").value)||0,
    active:document.getElementById("bActive").value==="true",
  };
  try{
    const url=SB_URL+"/rest/v1/banners"+(id?"?id=eq."+encodeURIComponent(id):"");
    const r=await fetch(url,{method:id?"PATCH":"POST",headers:{...H,Prefer:"return=minimal"},body:JSON.stringify(payload)});
    if(r.ok||r.status===204||r.status===201){
      showToast(id?"✅ Banner atualizado!":"✅ Banner criado!");closeBannerModal();loadBanners();
    } else {
      const err=await r.text();showToast("Erro "+r.status+": "+err.slice(0,80),true);
    }
  }catch(e){showToast("Erro: "+e.message,true);}
}

async function toggleBanner(id,active){
  try{
    await fetch(SB_URL+"/rest/v1/banners?id=eq."+encodeURIComponent(id),
      {method:"PATCH",headers:{...H,Prefer:"return=minimal"},body:JSON.stringify({active})});
    loadBanners();
  }catch(e){showToast("Erro: "+e.message,true);}
}

/* ── DELETE ── */
function askDelete(id,table){
  deleteId=id;deleteTable=table;
  document.getElementById("delModal").classList.add("open");
}

async function confirmDelete(){
  if(!deleteId)return;
  try{
    const r=await fetch(SB_URL+"/rest/v1/"+deleteTable+"?id=eq."+encodeURIComponent(deleteId),
      {method:"DELETE",headers:H});
    if(r.ok||r.status===204){
      showToast("🗑️ Excluído!");closeModal();
      if(deleteTable==="articles")loadArticles(); else loadBanners();
    } else showToast("Erro ao excluir",true);
  }catch(e){showToast("Erro: "+e.message,true);}
  deleteId=null;deleteTable=null;
}

function closeModal(){
  ["modal","delModal"].forEach(id=>document.getElementById(id).classList.remove("open"));
}
function closeBannerModal(){
  document.getElementById("bannerModal").classList.remove("open");
}

function showToast(msg,err=false){
  const t=document.getElementById("toast");
  t.textContent=msg;t.className="toast"+(err?" err":"");
  t.classList.add("show");setTimeout(()=>t.classList.remove("show"),3000);
}
</script>
