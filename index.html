@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121113; --surface:#1B1A1D; --fg:#ECEAE4; --muted:#9A978F; --line:#2C2A2E;
  --accent:#E6584F; --accent-ink:#1B1A1D; --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
  --pol:#8B83FF; --guia:#E0A64B; --mkt:#E6584F; --scv:#34C9A6;
  --banner:#2A2110; --banner-fg:#E9C987; --banner-line:#4A3A17;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#121113; --surface:#1B1A1D; --fg:#ECEAE4; --muted:#9A978F; --line:#2C2A2E;
  --accent:#E6584F; --accent-ink:#1B1A1D; --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
  --pol:#8B83FF; --guia:#E0A64B; --mkt:#E6584F; --scv:#34C9A6;
  --banner:#2A2110; --banner-fg:#E9C987; --banner-line:#4A3A17;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:16px;line-height:1.5;
  -webkit-font-smoothing:antialiased;padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
img{max-width:100%}
a{color:inherit}
.wrap{max-width:720px;margin:0 auto}
.gutter{padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}

header.mast{background:var(--surface);border-bottom:1px solid var(--line)}
.mast-in{display:flex;flex-direction:column;align-items:stretch;padding-block:16px}
.headrow{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.logo{flex:0 0 auto;background:var(--logo) center/contain no-repeat;height:40px;aspect-ratio:600/116}
.brand{font-family:"Montserrat",var(--sans);font-weight:800;font-size:29px;letter-spacing:-.03em;line-height:1;text-decoration:none;color:var(--fg);white-space:nowrap}
.brand .k{color:var(--accent);margin-right:-.02em}
.tagline{font-size:12.5px;color:var(--muted);margin-top:14px}
.right{display:flex;align-items:center;gap:10px;flex:0 0 auto}
.themebtn{width:34px;height:34px;border:1px solid var(--line);border-radius:50%;background:transparent;color:var(--muted);display:grid;place-items:center;cursor:pointer;flex:0 0 auto;padding:0}
.themebtn:hover{color:var(--accent);border-color:var(--accent)}
.themebtn svg{width:18px;height:18px}

.banner{background:var(--banner);color:var(--banner-fg);border-bottom:1px solid var(--banner-line);font-size:12.5px}
.banner-in{padding-block:9px}
.banner b{font-weight:700}

main{padding-block:16px 8px;min-height:60vh}
.feed{display:flex;flex-direction:column;gap:14px}
.card{display:grid;grid-template-columns:120px 1fr;gap:14px;background:var(--surface);border:1px solid var(--line);
  border-radius:14px;overflow:hidden;cursor:pointer;box-shadow:var(--shadow);transition:transform .12s}
.card:hover{transform:translateY(-1px)}

<script>
const SB_URL="https://yuqidbvfilomxkwaaerl.supabase.co";
const SB_KEY="sb_publishable_t3Qiwi-26sBX-0mbtdjXCA__h26yp3p";
const PAGE=20;
const TAGS={pol:"O Futuro Político", guia:"Guias Comerciais", mkt:"Marketing 2.0", scv:"Guia Só Curtindo a Vida"};
const PH='<div class="ph"><span>MKT Portal</span></div>';
const view=document.getElementById("view");
let query="",searchTimer=null,page=1,totalPages=1;

async function sb(path){
  const r=await fetch(SB_URL+"/rest/v1/"+path,{headers:{apikey:SB_KEY,Authorization:"Bearer "+SB_KEY}});
  if(!r.ok)throw new Error("HTTP "+r.status);
  return r.json();
}
function tagOf(a){
  const s=(a.section||"").toLowerCase().trim(),c=(a.category||"").toLowerCase();
  // 1) tag explícita vinda do Agente de Notícias (campo section)
  if(s==="scv"||s.indexOf("curtindo")>=0)return"scv";
  if(s==="mkt"||s.indexOf("marketing")>=0)return"mkt";
  if(s.indexOf("pol")>=0)return"pol";
  if(s==="guia"||s.indexOf("comercial")>=0)return"guia";
  // 2) fallback p/ conteúdo legado sem tag explícita (deriva da categoria)
  if(c.indexOf("marketing")>=0)return"mkt";
  if(c.indexOf("polít")>=0||c.indexOf("polit")>=0||c.indexOf("legisla")>=0)return"pol";
  return"guia";
}
function timeAgo(iso){if(!iso)return"";const d=new Date(iso),s=Math.floor((Date.now()-d)/1000);
  if(s<60)return"agora";const m=(s/60)|0;if(m<60)return"há "+m+" min";
  const h=(m/60)|0;if(h<24)return"há "+h+"h";const dd=(h/24)|0;
  if(dd===1)return"ontem";if(dd<7)return"há "+dd+" dias";
  return d.toLocaleDateString("pt-BR",{day:"2-digit",month:"short"});}
function esc(s){return(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
// sanitiza o corpo e REMOVE qualquer link (nunca apontar para a fonte)
function cleanHtml(h){return(h||"").replace(/<script[\s\S]*?<\/script>/gi,"").replace(/ on\w+="[^"]*"/gi,"").replace(/ on\w+='[^']*'/gi,"").replace(/<a\b[^>]*>/gi,"").replace(/<\/a>/gi,"");}
function tagChip(t){return'<span class="tag '+t+'">'+esc(TAGS[t])+'</span>';}
// subtag = category (ex.: Luto, Leis, Saúde), escondendo genéricas ou que repetem a tag
const GENERIC={"":1,"noticia":1,"notícia":1,"geral":1};
function subOf(a,t){const c=(a.category||"").trim(),k=c.toLowerCase();
  if(GENERIC[k])return"";
  if(t==="pol"&&(k.indexOf("polít")>=0||k.indexOf("polit")>=0||k.indexOf("legisla")>=0))return"";
  if(t==="mkt"&&k.indexOf("marketing")>=0)return"";
  if(t==="guia"&&k.indexOf("comercial")>=0)return"";
  return c;}
function tagRow(a){const t=tagOf(a),sub=subOf(a,t);
  return'<div class="tagrow">'+tagChip(t)+(sub?'<span class="subtag">'+esc(sub)+'</span>':'')+'</div>';}
window.imgFail=function(img){const p=img.parentNode;if(p)p.innerHTML=PH;};
function thumb(a){
  if(a.image_url)return'<div class="thumb"><img loading="lazy" referrerpolicy="no-referrer" src="'+esc(a.image_url)+'" onerror="imgFail(this)"></div>';
  return'<div class="thumb">'+PH+'</div>';
}
function cardHtml(a){
  return'<article class="card" onclick="go(\'#m-'+a.id+'\')">'+thumb(a)+
    '<div class="body">'+tagRow(a)+'<h2 class="hl">'+esc(a.title)+'</h2>'+
    (a.summary?'<p class="sum">'+esc(a.summary)+'</p>':'')+
    '<div class="when">'+timeAgo(a.published_at)+(a.city?' · '+esc(a.city):'')+'</div></div></article>';
}
// filtros server-side por editoria (ascii-safe, cobre conteúdo novo e legado)
const TAGGROUP={
  pol:"or(section.eq.politico,category.ilike.*pol*,category.ilike.*legisla*)",
  mkt:"or(section.eq.marketing,section.eq.mkt,category.ilike.*marketing*)",
  scv:"or(section.eq.scv,section.ilike.*curtindo*)",
  guia:"section.not.in.(politico,marketing,mkt,scv),section.not.ilike.*curtindo*,category.not.ilike.*pol*,category.not.ilike.*legisla*,category.not.ilike.*marketing*"
};
function feedParams(){
  const parts=[];
  if(activeTag&&TAGGROUP[activeTag])parts.push(TAGGROUP[activeTag]);
  if(query){const t="*"+encodeURIComponent(query)+"*";
    parts.push("or(title.ilike."+t+",summary.ilike."+t+",city.ilike."+t+",category.ilike."+t+",content.ilike."+t+")");}
  const p=["select=id,title,summary,image_url,category,city,section,published_at","order=published_at.desc.nullslast"];
  if(parts.length)p.push("and=("+parts.join(",")+")");
  return p;
}
function skeletons(n){let s="";for(let i=0;i<n;i++)s+='<div class="skel"></div>';return s;}
async function fetchPage(pg){
  const from=(pg-1)*PAGE,to=from+PAGE-1;
  const r=await fetch(SB_URL+"/rest/v1/articles?"+feedParams().join("&"),
    {headers:{apikey:SB_KEY,Authorization:"Bearer "+SB_KEY,"Range-Unit":"items",Range:from+"-"+to,Prefer:"count=exact"}});
  if(!r.ok&&r.status!==206)throw new Error("HTTP "+r.status);
  const rows=await r.json();
  let total=rows.length;const cr=r.headers.get("content-range");
  if(cr&&cr.indexOf("/")>=0){const t=cr.split("/")[1];if(t&&t!=="*")total=parseInt(t,10);}
  return {rows,total};
}
async function renderFeed(){
  view.innerHTML='<div class="feed">'+skeletons(4)+'</div>';
  let res;
  try{res=await fetchPage(page);}catch(e){view.innerHTML='<div class="state"><strong>Não consegui carregar</strong>Verifique a conexão e tente de novo.</div>';return;}
  totalPages=Math.max(1,Math.ceil(res.total/PAGE));
  if(page>totalPages){page=totalPages;return renderFeed();}
  if(!res.rows.length){const f=query||activeTag;
    view.innerHTML='<div class="state"><strong>'+(f?"Nada encontrado":"Sem matérias ainda")+'</strong>'+(f?"Tente outra palavra-chave ou editoria.":"Em breve as primeiras publicações.")+'</div>';return;}
  const cards=res.rows.map(cardHtml);
  let feedHtml;
  if(cards.length>10){ // banner rotativo entre a 10ª e a 11ª matéria
    feedHtml='<div class="feed">'+cards.slice(0,10).join("")+'</div>'
      +'<div id="adbarMid" class="adbar" style="margin:16px 0"></div>'
      +'<div class="feed">'+cards.slice(10).join("")+'</div>';
  }else feedHtml='<div class="feed">'+cards.join("")+'</div>';
  view.innerHTML=feedHtml+pager();
  buildAds();
}
function pager(){
  if(totalPages<=1)return"";
  const b=(n,lbl,cur,dis)=>'<button class="pg'+(cur?" cur":"")+'"'+(dis?" disabled":' onclick="gotoPage('+n+')"')+'>'+lbl+'</button>';
  const show=[];for(let i=1;i<=totalPages;i++)if(i===1||i===totalPages||Math.abs(i-page)<=1)show.push(i);
  let html='<nav class="pager" aria-label="Páginas">'+b(page-1,"‹",false,page<=1);
  let prev=0;show.forEach(i=>{if(prev&&i-prev>1)html+='<span class="pgdot">…</span>';html+=b(i,String(i),i===page,false);prev=i;});
  html+=b(page+1,"›",false,page>=totalPages)+'</nav>';
  return html;
}
function gotoPage(n){page=Math.min(Math.max(1,n),totalPages);renderFeed();window.scrollTo(0,0);}
window.gotoPage=gotoPage;
function galleryHtml(g){
  if(!Array.isArray(g)||!g.length)return"";
  const items=g.filter(u=>typeof u==="string"&&u).map(u=>'<a class="gitem" href="'+esc(u)+'" target="_blank" rel="noopener"><img loading="lazy" referrerpolicy="no-referrer" src="'+esc(u)+'" onerror="this.closest(\'.gitem\').remove()"></a>').join("");
  return items?'<h3 class="gtitle">Galeria de fotos</h3><div class="gallery">'+items+'</div>':"";
}
async function renderArticle(id){
  view.innerHTML='<div class="loading">Carregando matéria…</div>';
  let a;
  try{a=(await sb("articles?id=eq."+encodeURIComponent(id)+"&select=id,title,summary,content,image_url,gallery,category,city,section,published_at&limit=1"))[0];}catch(e){}
  if(!a){view.innerHTML='<div class="state"><strong>Matéria não encontrada</strong>Pode ter sido removida.</div>';return;}
  const hero=a.image_url?'<img class="hero" referrerpolicy="no-referrer" src="'+esc(a.image_url)+'" onerror="this.remove()">':'';
  const body=cleanHtml(a.content)||('<p>'+esc(a.summary||"")+'</p>');
  view.innerHTML='<button class="back" onclick="history.length>1?history.back():go(\'#feed\')">← Voltar</button>'+
    '<article class="read">'+tagRow(a)+'<h1>'+esc(a.title)+'</h1>'+
    '<div class="meta">'+timeAgo(a.published_at)+(a.city?' · '+esc(a.city):'')+'</div>'+
    hero+(a.summary?'<p class="lede">'+esc(a.summary)+'</p>':'')+
    '<div class="content">'+body+'</div>'+galleryHtml(a.gallery)+'</article>';
  window.scrollTo(0,0);
}
function go(hash){if(location.hash===hash)route();else location.hash=hash;}
function route(){const h=location.hash.replace(/^#/,"")||"feed";
  if(h.startsWith("m-")){renderArticle(h.slice(2));return;}renderFeed();window.scrollTo(0,0);}
document.getElementById("q").addEventListener("input",e=>{
  query=e.target.value.toLowerCase().trim().replace(/[(),*]/g," ").replace(/\s+/g," ").trim();
  clearTimeout(searchTimer);page=1;
  if(location.hash.replace(/^#/,"").startsWith("m-")){location.hash="#feed";return;}
  searchTimer=setTimeout(renderFeed,300);
});
// menu de editorias (tags)
const TAGMENU={"":"Todas",pol:"O Futuro Político",guia:"Guias Comerciais",mkt:"Marketing 2.0",scv:"Guia Só Curtindo a Vida"};
const TAGORDER=["","pol","guia","mkt","scv"];
let activeTag="";
function buildTagMenu(){const m=document.getElementById("tagmenu");if(!m)return;

function normBrand(n){return (n||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]/g,"");}
const BRANDFALLBACK={};DEFAULT_BRANDS.forEach(b=>BRANDFALLBACK[normBrand(b.name)]=b);
function iniciais(n){return (n||"").replace(/^Guia\s+/i,"").trim().split(/\s+/).slice(0,2).map(w=>w[0]||"").join("").toUpperCase();}
function brandItem(b){
  const inner=b.logo_url?'<img loading="lazy" referrerpolicy="no-referrer" src="'+esc(b.logo_url)+'" alt="'+esc(b.name)+'" onerror="this.parentNode.innerHTML=\'<span class=ini>'+esc(iniciais(b.name))+'</span>\'">':'<span class="ini">'+esc(iniciais(b.name))+'</span>';
  const body='<span class="brand-logo">'+inner+'</span><span class="brand-name">'+esc(b.name)+'</span>';
  return b.instagram_url?'<a class="brand-item" href="'+esc(b.instagram_url)+'" target="_blank" rel="noopener">'+body+'</a>':'<span class="brand-item">'+body+'</span>';
}
async function loadBrands(){
  const el=document.getElementById("brands");if(!el)return;
  let list=[];
  try{list=await sb("brands?select=name,logo_url,instagram_url&active=eq.true&order=sort.asc,name.asc");}catch(e){}
  list=(list||[]).filter(b=>b&&b.name);
  if(!list.length)list=DEFAULT_BRANDS.slice();
  else list=list.map(b=>{const f=BRANDFALLBACK[normBrand(b.name)]||{};return {name:b.name,logo_url:b.logo_url||f.logo_url||null,instagram_url:b.instagram_url||f.instagram_url||null};});
  el.innerHTML=list.map(brandItem).join("");
  startBrandAuto(el);
}
let brandRAF=null;
function startBrandAuto(el){
  if(brandRAF){cancelAnimationFrame(brandRAF);brandRAF=null;}
  if(window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  requestAnimationFrame(()=>{
    if(el.scrollWidth<=el.clientWidth+8)return;      // não precisa rolar
    el.innerHTML=el.innerHTML+el.innerHTML;           // duplica p/ loop sem emenda
    const half=el.scrollWidth/2;const speed=0.45;
    let pos=0,paused=false,resume=null;
    const pause=()=>{paused=true;if(resume)clearTimeout(resume);};
    const play=(delay)=>{if(resume)clearTimeout(resume);resume=setTimeout(()=>{pos=el.scrollLeft%half;paused=false;},delay||0);};
    el.addEventListener("pointerenter",pause);el.addEventListener("pointerleave",()=>play(0));
    el.addEventListener("pointerdown",pause);el.addEventListener("pointerup",()=>play(1500));
    el.addEventListener("touchstart",pause,{passive:true});el.addEventListener("touchend",()=>play(1500),{passive:true});
    function step(){if(!paused){pos+=speed;if(pos>=half)pos-=half;el.scrollLeft=pos;}brandRAF=requestAnimationFrame(step);}
    brandRAF=requestAnimationFrame(step);
  });
}

// banners rotativos (dois slots por posição: topo e rodapé), sincronizados e cruzados
// banners iniciais (usados enquanto não houver patrocinador cadastrado no painel)
const DEFAULT_ADS=[
  {image_url:"a1.jpg",link_url:null,position:"ambos"},
  {image_url:"a2.jpg",link_url:null,position:"ambos"},
  {image_url:"a3.jpg",link_url:null,position:"ambos"}
];
let SPON=null,adTick=0,adTimer=null,adSlots=[];
window.adImgFail=function(img){const s=img.closest(".adslide");if(s)s.innerHTML='<div class="adph"><span class="adnum">Publicidade</span><span>Espaço publicitário — <a href="https://wa.me/'+SETTINGS.wa1+'" target="_blank" rel="noopener">anuncie aqui</a></span></div>';};
function adSlidesFrom(list){
  if(list&&list.length){
    return{html:list.map(a=>{const img='<img loading="lazy" referrerpolicy="no-referrer" src="'+esc(a.image_url)+'" alt="'+esc(a.name||"Patrocinador")+'" onerror="adImgFail(this)">';
      return a.link_url?'<a class="adslide" href="'+esc(a.link_url)+'" target="_blank" rel="noopener sponsored">'+img+'</a>':'<div class="adslide">'+img+'</div>';}).join(""),n:list.length};
  }
  const cta=n=>'<div class="adslide"><div class="adph adph'+n+'"><span class="adnum">Banner '+n+'</span><span>Espaço publicitário — <a href="https://wa.me/'+SETTINGS.wa1+'" target="_blank" rel="noopener">anuncie aqui</a></span></div></div>';
  return{html:cta(1)+cta(2),n:2};
}
function slotList(posKey){return (SPON||[]).filter(s=>!s.position||s.position===posKey||s.position==="ambos");}
function renderAdSlot(elId,posKey,offset){
  const el=document.getElementById(elId);if(!el)return null;
  const {html,n}=adSlidesFrom(slotList(posKey));
  const dots=n>1?'<div class="addots">'+Array.from({length:n}).map((_,i)=>'<button class="addot" type="button" aria-label="Banner '+(i+1)+'"></button>').join("")+'</div>':"";
  el.innerHTML='<span class="adlabel">Publicidade</span><div class="adtrack">'+html+'</div>'+dots;
  const track=el.querySelector(".adtrack"),dotsEls=[...el.querySelectorAll(".addot")];
  const slot={n,offset,paint(){const idx=((adTick+offset)%n+n)%n;track.style.transform="translateX(-"+(idx*100)+"%)";dotsEls.forEach((d,k)=>d.setAttribute("aria-current",String(k===idx)));}};
  dotsEls.forEach((d,k)=>d.addEventListener("click",()=>{adTick=k-offset;paintAds();restartAds();}));
  el.onmouseenter=()=>clearInterval(adTimer);
  el.onmouseleave=restartAds;
  return slot;
}
function paintAds(){adSlots.forEach(s=>s&&s.paint());}
function restartAds(){clearInterval(adTimer);const maxn=Math.max(1,...adSlots.filter(Boolean).map(s=>s.n));if(maxn>1)adTimer=setInterval(()=>{adTick++;paintAds();},5000);}
// (re)monta todos os slots presentes no DOM: topo, meio (dentro do feed) e rodapé
function buildAds(){
  adTick=0;adSlots=[];
  [["adbar","topo",0],["adbarMid","meio",-1],["adbarFoot","rodape",-1]].forEach(function(s){
    if(!document.getElementById(s[0]))return;
    const off=s[2]<0?(Math.floor((slotList(s[1]).length||2)/2)||1):s[2];
    adSlots.push(renderAdSlot(s[0],s[1],off));
  });
  paintAds();restartAds();
}
async function loadAds(){
  let ads=[];
  try{ads=await sb("sponsors?select=*&active=eq.true&order=sort.asc,created_at.desc");}catch(e){}
  SPON=(ads||[]).filter(a=>a&&a.image_url);
  if(!SPON.length)SPON=DEFAULT_ADS.slice(); // fallback: banners iniciais
  buildAds();
}
