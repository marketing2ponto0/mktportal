<style>
/* Layout: masthead com logo no topo à direita; feed único; rodapé com logo menor + redes */
:root{
  --bg:#FBFAF7; --surface:#FFFFFF; --fg:#17161A; --muted:#6C6A63; --line:#E7E3DB;
  --accent:#A01313; --accent-ink:#FFFFFF; --shadow:0 1px 2px rgba(20,18,16,.06),0 8px 24px rgba(20,18,16,.05);
  --pol:#4F46E5; --guia:#B45309; --mkt:#A01313; --scv:#0E7C66;
  --banner:#FBEEDC; --banner-fg:#7A5212; --banner-line:#EDD6AE;
  --serif:"Newsreader",Georgia,"Times New Roman",serif;
  --sans:"Inter",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121113; --surface:#1B1A1D; --fg:#ECEAE4; --muted:#9A978F; --line:#2C2A2E;
  --accent:#E6584F; --accent-ink:#1B1A1D; --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
  --pol:#8B83FF; --guia:#E0A64B; --mkt:#E6584F; --scv:#34C9A6;
  --banner:#2A2110; --banner-fg:#E9C987; --banner-line:#4A3A17;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#121113; --surface:#1B1A1D; --fg:#ECEAE4; --muted:#9A978F; --line:#2C2A2E;
  --accent:#E6584F; --accent-ink:#1B1A1D; --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
  --pol:#8B83FF; --guia:#E0A64B; --mkt:#E6584F; --scv:#34C9A6;
  --banner:#2A2110; --banner-fg:#E9C987; --banner-line:#4A3A17;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:16px;line-height:1.5;
  -webkit-font-smoothing:antialiased;padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
img{max-width:100%}
a{color:inherit}
.wrap{max-width:720px;margin:0 auto}
.gutter{padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}

header.mast{background:var(--surface);border-bottom:1px solid var(--line)}
.mast-in{display:flex;flex-direction:column;align-items:stretch;padding-block:16px}
.headrow{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.logo{flex:0 0 auto;background:url('/logo.png') center/contain no-repeat;height:40px;aspect-ratio:1/1}
.brand{font-family:"Montserrat",var(--sans);font-weight:800;font-size:29px;letter-spacing:-.03em;line-height:1;text-decoration:none;color:var(--fg);white-space:nowrap}
.brand .k{color:var(--accent);margin-right:-.02em}
.tagline{font-size:12.5px;color:var(--muted);margin-top:14px}
.right{display:flex;align-items:center;gap:10px;flex:0 0 auto}
.themebtn{width:34px;height:34px;border:1px solid var(--line);border-radius:50%;background:transparent;color:var(--muted);display:grid;place-items:center;cursor:pointer;flex:0 0 auto;padding:0}
.themebtn:hover{color:var(--accent);border-color:var(--accent)}
.themebtn svg{width:18px;height:18px}

.banner{background:var(--banner);color:var(--banner-fg);border-bottom:1px solid var(--banner-line);font-size:12.5px}
.banner-in{padding-block:9px}
.banner b{font-weight:700}

main{padding-block:16px 8px;min-height:60vh}
.feed{display:flex;flex-direction:column;gap:14px}
.card{display:grid;grid-template-columns:120px 1fr;gap:14px;background:var(--surface);border:1px solid var(--line);
  border-radius:14px;overflow:hidden;cursor:pointer;box-shadow:var(--shadow);transition:transform .12s}
.card:hover{transform:translateY(-1px)}
.thumb{position:relative;background:color-mix(in srgb,var(--fg) 5%,var(--surface));aspect-ratio:1/1;min-width:0;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:contain;display:block;background:#111}
.ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 14%,var(--surface)),var(--surface))}
.ph span{font-family:var(--serif);font-weight:700;color:color-mix(in srgb,var(--accent) 72%,var(--fg));font-size:14px}
.card .body{min-width:0;padding:12px 14px 12px 0;display:flex;flex-direction:column;gap:7px}
.tagrow{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.tag{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;
  padding:3px 9px;border-radius:999px;color:#fff;line-height:1.4;background:#A01313}
.subtag{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;
  padding:2px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted);line-height:1.5;background:transparent}
.hl{font-family:var(--serif);font-weight:600;font-size:17.5px;line-height:1.22;margin:0;letter-spacing:-.01em;
  text-wrap:balance;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.sum{font-size:13.5px;color:var(--muted);margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.when{font-size:11.5px;color:var(--muted);margin-top:auto;font-variant-numeric:tabular-nums}

.searchbar{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px) saturate(1.2);-webkit-backdrop-filter:blur(8px) saturate(1.2);border-bottom:1px solid var(--line);padding-block:10px}
.searchbox{display:flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 13px;height:46px}
.searchbox:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 16%,transparent)}
.lupa{width:19px;height:19px;color:var(--muted);flex:0 0 auto}
.searchbox input{flex:1;min-width:0;border:0;background:transparent;color:var(--fg);font-family:var(--sans);font-size:15px;outline:none;padding:0}
.searchbox input::placeholder{color:var(--muted)}
.loading{text-align:center;color:var(--muted);font-size:13px;padding:14px}
.pager{display:flex;gap:6px;justify-content:center;align-items:center;flex-wrap:wrap;padding:24px 0 8px}
.pg{min-width:38px;height:38px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font-weight:600;border-radius:9px;cursor:pointer;font-family:inherit;font-size:14px;padding:0 10px;font-variant-numeric:tabular-nums}
.pg:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.pg.cur{background:var(--accent);border-color:var(--accent);color:#fff}
.pg:disabled{opacity:.4;cursor:default}
.pgdot{color:var(--muted);padding:0 2px}
.state{text-align:center;color:var(--muted);padding:40px 16px;font-size:14px}
.state strong{display:block;color:var(--fg);font-weight:700;font-size:17px;margin-bottom:5px}

.back{display:inline-flex;align-items:center;gap:6px;background:none;border:0;color:var(--muted);
  font-family:var(--sans);font-weight:600;font-size:14px;cursor:pointer;padding:16px 0 4px}
.back:hover{color:var(--accent)}
article.read{padding-bottom:8px}
.read .tag{margin:8px 0 2px}
.read h1{font-family:var(--serif);font-weight:700;font-size:28px;line-height:1.14;letter-spacing:-.02em;text-wrap:balance;margin:8px 0 8px}
.read .meta{font-size:12.5px;color:var(--muted);margin-bottom:14px}
.content{font-family:var(--serif);font-size:18px;line-height:1.62}
.content p{margin:0 0 15px}

footer{border-top:1px solid var(--line);margin-top:28px;padding-block:24px 32px;color:var(--muted);font-size:13px;background:var(--surface)}
.footcol{display:flex;flex-direction:column;gap:14px;align-items:flex-start}
.logo-foot{background:url('/logo.png') left center/contain no-repeat;height:26px;aspect-ratio:1/1}
.socials{display:flex;gap:10px;flex-wrap:wrap}
.socials a{width:38px;height:38px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;
  color:var(--muted);transition:.15s}
.socials a:hover{color:#fff;background:var(--accent);border-color:var(--accent)}
.socials svg{width:19px;height:19px;display:block}
.contact{display:flex;flex-direction:column;gap:3px}
.contact b{color:var(--fg);font-weight:600}
.contact a{color:inherit;text-decoration:none}
.contact a:hover{color:var(--accent)}
.devby{font-size:13px;align-self:stretch;text-align:center}
.devby a{color:inherit;text-decoration:none}
.devby a:hover,.devby a:focus-visible{color:var(--accent)}
.copy{font-size:12px;align-self:stretch;text-align:center}

.skel{height:118px;border:1px solid var(--line);border-radius:14px;background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--fg) 7%,transparent),transparent),var(--surface);background-size:220% 100%,auto;animation:sh 1.3s infinite}
@keyframes sh{0%{background-position:-120% 0,0 0}100%{background-position:120% 0,0 0}}
.loading{text-align:center;color:var(--muted);font-size:13.5px;padding:34px 14px}
.lede{font-size:16px;color:var(--fg);margin:2px 0 14px;font-style:italic;opacity:0.85}
.gtitle{font-family:var(--serif);font-weight:600;font-size:18px;margin:24px 0 10px}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.gitem{display:block;aspect-ratio:1/1;border-radius:10px;overflow:hidden;background:color-mix(in srgb,var(--fg) 5%,var(--surface))}
.gitem img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .2s}
.gitem:hover img{transform:scale(1.05)}
@media(max-width:430px){.gallery{grid-template-columns:repeat(2,1fr)}}

.tagmenu{border-bottom:1px solid var(--line);background:var(--bg)}
.tagmenu-in{display:flex;gap:8px;overflow-x:auto;padding-block:11px;scrollbar-width:none}
.tagmenu-in::-webkit-scrollbar{display:none}
.tchip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:13px;font-weight:600;padding:7px 13px;border-radius:999px;cursor:pointer;white-space:nowrap;transition:.15s}
.tchip:hover{color:var(--fg)}
.tchip[aria-current="true"]{background:#A01313;border-color:#A01313;color:#fff}
.brands{border-bottom:1px solid var(--line)}
.brands-in{display:flex;gap:16px;overflow-x:auto;padding-block:14px;scrollbar-width:none}
.brands-in::-webkit-scrollbar{display:none}
.brand-item{flex:0 0 auto;width:74px;display:flex;flex-direction:column;align-items:center;gap:6px;text-decoration:none;color:var(--muted)}
.brand-item:hover{color:var(--accent)}
.brand-logo{width:62px;height:62px;border-radius:50%;padding:2px;background:var(--bg);
  border:2px solid color-mix(in srgb,var(--fg) 20%,var(--surface));display:grid;place-items:center;transition:transform .15s,border-color .15s}
.brand-item:hover .brand-logo{transform:translateY(-2px);border-color:var(--accent)}
.brand-logo img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;background:#fff}
.brand-logo .ini{width:100%;height:100%;border-radius:50%;background:#fff;display:grid;place-items:center;font-family:var(--serif);font-weight:700;font-size:21px;color:var(--accent)}
.brand-name{font-size:10px;font-weight:600;line-height:1.2;text-align:center;max-width:74px}
.adwrap{padding-top:16px}
.adwrap-foot{padding-top:4px;padding-bottom:20px}
.wa-fab{position:fixed;z-index:60;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));
  width:60px;height:60px;border-radius:50%;background:linear-gradient(135deg,#25D366,#128C7E);box-shadow:0 4px 20px rgba(37,211,102,.45);display:grid;place-items:center;transition:transform .2s,box-shadow .2s;text-decoration:none}
.wa-fab:hover{transform:translateY(-3px) scale(1.05);box-shadow:0 6px 28px rgba(37,211,102,.55)}
.wa-fab:active{transform:scale(.95)}
.wa-fab svg{width:34px;height:34px;display:block;filter:drop-shadow(0 1px 2px rgba(0,0,0,.15))}
.wa-fab::before{content:'Fale conosco!';position:absolute;right:70px;top:50%;transform:translateY(-50%);background:var(--bg,#fff);color:var(--fg,#222);font-size:13px;font-weight:600;padding:6px 14px;border-radius:20px;box-shadow:0 2px 12px rgba(0,0,0,.15);white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .25s}
.wa-fab:hover::before{opacity:1}
@media(max-width:430px){.wa-fab{width:56px;height:56px}.wa-fab svg{width:32px;height:32px}.wa-fab::before{display:none}}
.adbar{position:relative;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface)}
.adtrack{display:flex;transition:transform .45s ease}
.adslide{flex:0 0 100%;display:block}
.adslide img{width:100%;height:100%;object-fit:cover;display:block;aspect-ratio:4/1}
.adlabel{position:absolute;top:8px;right:10px;z-index:2;font-size:9px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#fff;background:rgba(0,0,0,.42);padding:2px 7px;border-radius:999px}
.addots{position:absolute;left:0;right:0;bottom:8px;z-index:2;display:flex;gap:6px;justify-content:center}
.addot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.55);border:0;padding:0;cursor:pointer;box-shadow:0 0 2px rgba(0,0,0,.3)}
.addot[aria-current="true"]{background:#fff}
.adph{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;aspect-ratio:4/1;min-height:96px;color:var(--muted);font-size:13.5px;text-align:center;padding:12px}
.adph a{color:var(--accent);font-weight:700;text-decoration:none}
.adph a:hover{text-decoration:underline}
.adnum{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--fg);opacity:.55}
.adph1{background:repeating-linear-gradient(45deg,color-mix(in srgb,var(--accent) 5%,var(--surface)),color-mix(in srgb,var(--accent) 5%,var(--surface)) 12px,var(--surface) 12px,var(--surface) 24px)}
.adph2{background:repeating-linear-gradient(-45deg,color-mix(in srgb,var(--fg) 4%,var(--surface)),color-mix(in srgb,var(--fg) 4%,var(--surface)) 12px,var(--surface) 12px,var(--surface) 24px)}

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo,:root:not([data-theme="light"]) .logo-foot{filter:brightness(1.45) saturate(1.05)}}
:root[data-theme="dark"] .logo,:root[data-theme="dark"] .logo-foot{filter:brightness(1.45) saturate(1.05)}
@media(max-width:560px){ .logo{height:34px} }
@media(max-width:430px){.card{grid-template-columns:104px 1fr;gap:12px}.read h1{font-size:25px}.content{font-size:17px}.brand{font-size:22px}.logo{height:30px}.themebtn{width:30px;height:30px}}
</style>
</head>

function tagOf(a){

  if(c.indexOf("marketing")>=0)return"mkt";

function timeAgo(iso){if(!iso)return"";const d=new Date(iso),s=Math.floor((Date.now()-d)/1000);
  if(s<60)return"agora";const m=(s/60)|0;if(m<60)return"há "+m+" min";
  const h=(m/60)|0;if(h<24)return"há "+h+"h";const dd=(h/24)|0;
  if(dd===1)return"ontem";if(dd<7)return"há "+dd+" dias";
  return d.toLocaleDateString("pt-BR",{day:"2-digit",month:"short"});}

function subOf(a,t){const c=(a.category||"").trim(),k=c.toLowerCase();

function feedParams(){

    {headers:{apikey:SB_KEY,Authorization:"Bearer "+SB_KEY,"Range-Unit":"items",Range:from+"-"+to,Prefer:"count=exact"}});

  if(cr&&cr.indexOf("/")>=0){const t=cr.split("/")[1];if(t&&t!=="*")total=parseInt(t,10);}
  return {rows,total};

async function renderFeed(){

function normBrand(n){return (n||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]/g,"");}
const BRANDFALLBACK={};DEFAULT_BRANDS.forEach(b=>BRANDFALLBACK[normBrand(b.name)]=b);
function iniciais(n){return (n||"").replace(/^Guia\s+/i,"").trim().split(/\s+/).slice(0,2).map(w=>w[0]||"").join("").toUpperCase();}
function brandItem(b){
  const inner=b.logo_url?'<img loading="lazy" referrerpolicy="no-referrer" src="'+esc(b.logo_url)+'" alt="'+esc(b.name)+'" onerror="this.parentNode.innerHTML=\'<span class=ini>'+esc(iniciais(b.name))+'</span>\'">':'<span class="ini">'+esc(iniciais(b.name))+'</span>';
  const body='<span class="brand-logo">'+inner+'</span><span class="brand-name">'+esc(b.name)+'</span>';
  return b.instagram_url?'<a class="brand-item" href="'+esc(b.instagram_url)+'" target="_blank" rel="noopener">'+body+'</a>':'<span class="brand-item">'+body+'</span>';
}
async function loadBrands(){
  const el=document.getElementById("brands");if(!el)return;
  let list=[];
  try{list=await sb("brands?select=name,logo_url,instagram_url&active=eq.true&order=sort.asc,name.asc");}catch(e){}
  list=(list||[]).filter(b=>b&&b.name);
  if(!list.length)list=DEFAULT_BRANDS.slice();
  else list=list.map(b=>{const f=BRANDFALLBACK[normBrand(b.name)]||{};return {name:b.name,logo_url:b.logo_url||f.logo_url||null,instagram_url:b.instagram_url||f.instagram_url||null};});
  el.innerHTML=list.map(brandItem).join("");
  startBrandAuto(el);
}
let brandRAF=null;
function startBrandAuto(el){
  if(brandRAF){cancelAnimationFrame(brandRAF);brandRAF=null;}
  if(window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  requestAnimationFrame(()=>{
    if(el.scrollWidth<=el.clientWidth+8)return;      // não precisa rolar
    el.innerHTML=el.innerHTML+el.innerHTML;           // duplica p/ loop sem emenda
    const half=el.scrollWidth/2;const speed=0.45;
    let pos=0,paused=false,resume=null;
    const pause=()=>{paused=true;if(resume)clearTimeout(resume);};
    const play=(delay)=>{if(resume)clearTimeout(resume);resume=setTimeout(()=>{pos=el.scrollLeft%half;paused=false;},delay||0);};
    el.addEventListener("pointerenter",pause);el.addEventListener("pointerleave",()=>play(0));
    el.addEventListener("pointerdown",pause);el.addEventListener("pointerup",()=>play(1500));
    el.addEventListener("touchstart",pause,{passive:true});el.addEventListener("touchend",()=>play(1500),{passive:true});
    function step(){if(!paused){pos+=speed;if(pos>=half)pos-=half;el.scrollLeft=pos;}brandRAF=requestAnimationFrame(step);}
    brandRAF=requestAnimationFrame(step);
  });
}

function adSlidesFrom(list){

      return a.link_url?'<a class="adslide" href="'+esc(a.link_url)+'" target="_blank" rel="noopener sponsored">'+img+'</a>':'<div class="adslide">'+img+'</div>';}).join(""),n:list.length};

function slotList(posKey){return (SPON||[]).filter(s=>!s.position||s.position===posKey||s.position==="ambos");}
function renderAdSlot(elId,posKey,offset){
  const el=document.getElementById(elId);if(!el)return null;
  const {html,n}=adSlidesFrom(slotList(posKey));
  const dots=n>1?'<div class="addots">'+Array.from({length:n}).map((_,i)=>'<button class="addot" type="button" aria-label="Banner '+(i+1)+'"></button>').join("")+'</div>':"";
  el.innerHTML='<span class="adlabel">Publicidade</span><div class="adtrack">'+html+'</div>'+dots;
  const track=el.querySelector(".adtrack"),dotsEls=[...el.querySelectorAll(".addot")];
  const slot={n,offset,paint(){const idx=((adTick+offset)%n+n)%n;track.style.transform="translateX(-"+(idx*100)+"%)";dotsEls.forEach((d,k)=>d.setAttribute("aria-current",String(k===idx)));}};
  dotsEls.forEach((d,k)=>d.addEventListener("click",()=>{adTick=k-offset;paintAds();restartAds();}));
  el.onmouseenter=()=>clearInterval(adTimer);
  el.onmouseleave=restartAds;
  return slot;
}
function paintAds(){adSlots.forEach(s=>s&&s.paint());}
function restartAds(){clearInterval(adTimer);const maxn=Math.max(1,...adSlots.filter(Boolean).map(s=>s.n));if(maxn>1)adTimer=setInterval(()=>{adTick++;paintAds();},5000);}
// (re)monta todos os slots presentes no DOM: topo, meio (dentro do feed) e rodapé
function buildAds(){
  adTick=0;adSlots=[];
  [["adbar","topo",0],["adbarMid","meio",-1],["adbarFoot","rodape",-1]].forEach(function(s){
    if(!document.getElementById(s[0]))return;
    const off=s[2]<0?(Math.floor((slotList(s[1]).length||2)/2)||1):s[2];
    adSlots.push(renderAdSlot(s[0],s[1],off));
  });
  paintAds();restartAds();
}
async function loadAds(){
  let ads=[];
  try{ads=await sb("sponsors?select=*&active=eq.true&order=sort.asc,created_at.desc");}catch(e){}
  SPON=(ads||[]).filter(a=>a&&a.image_url);
  if(!SPON.length)SPON=DEFAULT_ADS.slice(); // fallback: banners iniciais
  buildAds();
}

function toggleTheme(){const t=_root.dataset.theme==="dark"?"light":"dark";try{localStorage.setItem("pmkt-theme",t);}catch(e){}applyTheme(t);}
(function(){let t="light";try{t=localStorage.getItem("pmkt-theme")||"light";}catch(e){}applyTheme(t);})();
